<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strand tegoed — Klanten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6f3ec; --white: #ffffff; --navy: #1b3a5c; --navy-dark: #0e1c2a;
    --body-text: #3a4a5c; --muted: #7a8ea0; --teal: #497a9d; --teal-dark: #376079; --teal-light: #6496b5;
    --coral: #e8604a; --coral-light: #f08c78; --wood: #c47a45;
    --line: rgba(27, 58, 92, 0.12); --shadow: 0 2px 14px rgba(27, 58, 92, 0.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--body-text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  .accent-line { height: 3px; background: linear-gradient(90deg, var(--teal), var(--coral)); }

  header { background: var(--navy-dark); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .header-inner {
    max-width: 1180px; margin: 0 auto; padding: 24px 32px;
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .brand-eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240,244,247,0.55); margin: 0 0 6px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 450; font-size: 26px; margin: 0; letter-spacing: -0.01em; color: var(--white); }
  nav a {
    color: rgba(240,244,247,0.6); text-decoration: none; font-size: 12px; margin-left: 22px;
    letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid transparent; padding-bottom: 3px;
    transition: color 0.15s, border-color 0.15s;
  }
  nav a:hover, nav a:focus-visible { color: var(--white); border-color: var(--coral); }
  nav a.active { color: var(--coral-light); }
  .config-toggle {
    background: none; border: 1px solid rgba(240,244,247,0.25); color: rgba(240,244,247,0.7); font-family: 'Inter', sans-serif;
    font-size: 12px; padding: 8px 14px; border-radius: 20px; cursor: pointer;
  }
  .config-toggle:hover, .config-toggle:focus-visible { border-color: var(--coral); color: var(--white); }

  #config-panel { max-width: 1180px; margin: 0 auto; padding: 0 32px 20px; display: none; gap: 12px; flex-wrap: wrap; }
  #config-panel.open { display: flex; }
  #config-panel label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; flex: 1; min-width: 220px; }
  #config-panel input {
    background: var(--white); border: 1px solid var(--line); color: var(--body-text);
    padding: 10px 12px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px;
  }
  #config-panel button {
    align-self: flex-end; background: var(--coral); color: var(--white); border: none;
    padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 32px 32px 80px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .status-line { font-size: 13px; color: var(--muted); margin-bottom: 16px; grid-column: 1 / -1; min-height: 18px; }
  .status-line.error { color: var(--coral); }

  .list-panel { background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 18px; padding: 20px; align-self: start; }
  .search-box {
    width: 100%; background: var(--cream); border: 1px solid var(--line); color: var(--body-text);
    padding: 12px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 16px;
  }
  .search-box:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

  .customer-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 10px;
    border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .customer-row:hover, .customer-row:focus-visible { background: var(--cream); }
  .customer-row.selected { border-color: var(--teal); background: var(--cream); }
  .customer-row .name { font-size: 14px; color: var(--navy); }
  .customer-row .name .tier { display: inline-block; margin-left: 6px; font-size: 10px; color: var(--wood); letter-spacing: 0.05em; text-transform: uppercase; }
  .customer-row .balance { font-family: 'Fraunces', serif; font-size: 14px; color: var(--coral); }
  .empty-note { color: var(--muted); font-size: 13px; padding: 10px; }

  .detail-panel { background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 18px; padding: 32px; min-height: 200px; }
  .detail-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 60px 20px; }

  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
  .detail-header h2 { font-family: 'Fraunces', serif; font-weight: 450; font-size: 26px; margin: 0 0 6px; color: var(--navy); }
  .detail-header .sub { color: var(--muted); font-size: 13px; }
  .detail-balance { text-align: right; }
  .detail-balance .value { font-family: 'Fraunces', serif; font-size: 36px; color: var(--coral); font-variant-numeric: tabular-nums; }
  .detail-balance .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  @media (max-width: 600px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
  .stat-strip .tile { background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat-strip .tile .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-strip .tile .value { font-family: 'Fraunces', serif; font-size: 18px; color: var(--navy); }

  h3.section-title { font-family: 'Fraunces', serif; font-weight: 450; font-size: 16px; margin: 0 0 12px; color: var(--navy); }

  .ledger-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0;
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-row .type { color: var(--navy); }
  .ledger-row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ledger-row .amount { font-family: 'Fraunces', serif; font-variant-numeric: tabular-nums; }
  .ledger-row .amount.credit { color: var(--teal); }
  .ledger-row .amount.debit { color: var(--coral); }

  footer { max-width: 1180px; margin: 0 auto; padding: 24px 32px 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <p class="brand-eyebrow">Het Strand &amp; Zomers</p>
      <h1>Klanten</h1>
    </div>
    <div>
      <nav>
        <a href="dashboard.html">Overzicht</a>
        <a href="#" class="active" aria-current="page">Klanten</a>
        <a href="campaigns.html">Campagnes</a>
        <a href="transacties.html">Kassa</a>
        <a href="cadeaus.html">Cadeaus</a>
        <a href="inschrijven.html">Inschrijven</a>
      </nav>
      <button class="config-toggle" id="config-toggle" aria-expanded="false" style="margin-left:18px;">Verbinding instellen</button>
    </div>
  </div>
</header>
<div class="accent-line"></div>

<div id="config-panel">
  <label>API-basis-URL<input type="text" id="api-base" placeholder="https://loyalty-platform-live.vercel.app"></label>
  <label>Organisatie-ID<input type="text" id="org-id" placeholder="ab51a93c-..."></label>
  <button id="config-save">Opslaan &amp; laden</button>
</div>

<main>
  <p class="status-line" id="status-line">Klanten laden…</p>

  <div class="list-panel">
    <input type="text" class="search-box" id="search-box" placeholder="Zoek op naam, e-mail of telefoon…">
    <div id="customer-list"></div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">Selecteer een klant om het profiel te bekijken.</div>
  </div>
</main>

<footer>
  Strand tegoed backoffice — verbindt rechtstreeks met je live platform-API.
</footer>

<script>
  const els = {
    statusLine: document.getElementById('status-line'),
    configToggle: document.getElementById('config-toggle'),
    configPanel: document.getElementById('config-panel'),
    configSave: document.getElementById('config-save'),
    apiBaseInput: document.getElementById('api-base'),
    orgIdInput: document.getElementById('org-id'),
    searchBox: document.getElementById('search-box'),
    customerList: document.getElementById('customer-list'),
    detailPanel: document.getElementById('detail-panel'),
  };

  const DEFAULTS = {
    apiBase: 'https://loyalty-platform-live.vercel.app',
    orgId: 'ab51a93c-43a2-40cd-8635-f8522f68a8c8',
  };

  const PERMISSIONS = 'customer.read,wallet.read';

  const ENTRY_TYPE_LABELS = {
    earn: 'Gespaard',
    bonus: 'Bonus',
    campaign_bonus: 'Campagnebonus',
    manual_adjustment: 'Handmatige correctie',
    refund_reversal: 'Terugboeking',
    expiration: 'Verlopen',
    transfer: 'Overdracht',
    correction: 'Correctie',
    redeem: 'Besteed',
  };

  function getConfig() {
    return {
      apiBase: localStorage.getItem('bc_api_base') || DEFAULTS.apiBase,
      orgId: localStorage.getItem('bc_org_id') || DEFAULTS.orgId,
    };
  }

  function points(n) {
    if (n === null || n === undefined) return '—';
    return Math.round(Number(n)).toLocaleString('nl-NL') + ' pt';
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function apiGet(path) {
    const { apiBase, orgId } = getConfig();
    const res = await fetch(apiBase + path, { headers: { 'x-organization-id': orgId, 'x-permissions': PERMISSIONS } });
    if (!res.ok) throw new Error('API-fout: ' + res.status);
    return res.json();
  }

  let allCustomers = [];
  let selectedId = null;

  function renderList(filterText) {
    const filtered = !filterText
      ? allCustomers
      : allCustomers.filter((c) => {
          const haystack = [c.firstName, c.lastName, c.email, c.phone].filter(Boolean).join(' ').toLowerCase();
          return haystack.includes(filterText.toLowerCase());
        });

    if (filtered.length === 0) {
      els.customerList.innerHTML = '<div class="empty-note">Geen klanten gevonden.</div>';
      return;
    }

    els.customerList.innerHTML = filtered
      .map((c) => {
        const name = [c.firstName, c.lastName].filter(Boolean).join(' ') || '(naam onbekend)';
        const tier = c.tierId ? '<span class="tier">Goud</span>' : '';
        return `<div class="customer-row ${c.id === selectedId ? 'selected' : ''}" data-id="${c.id}" tabindex="0" role="button">
          <span class="name">${name}${tier}</span>
          <span class="balance">${points(c.availableBalance)}</span>
        </div>`;
      })
      .join('');

    els.customerList.querySelectorAll('.customer-row').forEach((row) => {
      row.addEventListener('click', () => selectCustomer(row.dataset.id));
      row.addEventListener('keypress', (e) => { if (e.key === 'Enter') selectCustomer(row.dataset.id); });
    });
  }

  async function loadCustomers() {
    els.statusLine.textContent = 'Klanten laden…';
    els.statusLine.classList.remove('error');
    try {
      const { orgId } = getConfig();
      const result = await apiGet('/organizations/' + orgId + '/customers');
      allCustomers = result.items || [];
      renderList(els.searchBox.value);
      els.statusLine.textContent = allCustomers.length + ' klanten geladen';
    } catch (err) {
      els.statusLine.textContent = 'Kon geen verbinding maken: ' + err.message;
      els.statusLine.classList.add('error');
    }
  }

  async function selectCustomer(id) {
    selectedId = id;
    renderList(els.searchBox.value);
    els.detailPanel.innerHTML = '<div class="detail-empty">Profiel laden…</div>';

    try {
      const { orgId } = getConfig();
      const [customer, wallet, ledger] = await Promise.all([
        apiGet('/organizations/' + orgId + '/customers/' + id),
        apiGet('/organizations/' + orgId + '/customers/' + id + '/wallet').catch(() => null),
        apiGet('/organizations/' + orgId + '/customers/' + id + '/wallet/ledger').catch(() => []),
      ]);

      const name = [customer.firstName, customer.lastName].filter(Boolean).join(' ') || '(naam onbekend)';
      const contact = [customer.email, customer.phone].filter(Boolean).join(' · ') || 'Geen contactgegevens';

      const ledgerRows = (Array.isArray(ledger) ? ledger : [])
        .slice(0, 15)
        .map((entry) => {
          const sign = ['redeem', 'expiration'].includes(entry.entryType) ? '−' : '+';
          const cls = sign === '+' ? 'credit' : 'debit';
          const label = ENTRY_TYPE_LABELS[entry.entryType] || entry.entryType.replace(/_/g, ' ');
          return `<div class="ledger-row">
            <div>
              <div class="type">${label}</div>
              <div class="meta">${formatDate(entry.occurredAt)}${entry.reason ? ' · ' + entry.reason : ''}</div>
            </div>
            <div class="amount ${cls}">${sign}${Math.round(entry.amount)} pt</div>
          </div>`;
        })
        .join('');

      els.detailPanel.innerHTML = `
        <div class="detail-header">
          <div>
            <h2>${name}</h2>
            <div class="sub">${contact}${customer.tierId ? ' · Goud-lid' : ''}</div>
          </div>
          <div class="detail-balance">
            <div class="value">${points(wallet ? wallet.availableBalance : customer.currentBalance)}</div>
            <div class="label">Beschikbaar tegoed</div>
          </div>
        </div>

        <div class="stat-strip">
          <div class="tile"><div class="label">Bezoeken</div><div class="value">${customer.visitCount ?? 0}</div></div>
          <div class="tile"><div class="label">Totale besteding</div><div class="value">€${Number(customer.lifetimeSpend ?? 0).toLocaleString('nl-NL', { minimumFractionDigits: 2 })}</div></div>
          <div class="tile"><div class="label">Laatste bezoek</div><div class="value">${formatDate(customer.lastVisitAt)}</div></div>
          <div class="tile"><div class="label">Totaal gespaard</div><div class="value">${points(wallet ? wallet.lifetimeEarned : customer.lifetimeEarned)}</div></div>
        </div>

        <h3 class="section-title">Recente mutaties</h3>
        ${ledgerRows || '<div class="empty-note">Nog geen mutaties.</div>'}
      `;
    } catch (err) {
      els.detailPanel.innerHTML = '<div class="detail-empty">Kon profiel niet laden: ' + err.message + '</div>';
    }
  }

  els.configToggle.addEventListener('click', () => {
    const open = els.configPanel.classList.toggle('open');
    els.configToggle.setAttribute('aria-expanded', String(open));
    if (open) {
      const { apiBase, orgId } = getConfig();
      els.apiBaseInput.value = apiBase;
      els.orgIdInput.value = orgId;
    }
  });

  els.configSave.addEventListener('click', () => {
    localStorage.setItem('bc_api_base', els.apiBaseInput.value.trim() || DEFAULTS.apiBase);
    localStorage.setItem('bc_org_id', els.orgIdInput.value.trim() || DEFAULTS.orgId);
    els.configPanel.classList.remove('open');
    loadCustomers();
  });

  let searchTimeout;
  els.searchBox.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => renderList(els.searchBox.value), 150);
  });

  loadCustomers();
</script>

</body>
</html>
